<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo sutil -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Gradiente da lâmina plastificada (Polaseal) -->
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Brilho de plastificação -->
    <linearGradient id="glareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Gradiente do marcador de quadro branco -->
    <linearGradient id="markerBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <linearGradient id="markerTip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Sombra suave para relevo -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fundo do Card -->
  <rect width="600" height="450" rx="16" fill="url(#bgGrad)" />

  <!-- Pasta Sanfonada / Ficha de Apoio ao fundo (em ângulo sutil) -->
  <g transform="translate(75, 45) rotate(-4)" filter="url(#dropShadow)">
    <rect width="360" height="260" rx="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
    <!-- Guia da pasta -->
    <path d="M 20 0 L 110 0 C 115 0 120 10 125 15 L 360 15 L 360 260 L 0 260 L 0 15 C 0 5 10 0 20 0 Z" fill="#cbd5e1" opacity="0.6" />
    <!-- Linhas decorativas da ficha de trás -->
    <line x1="30" y1="50" x2="160" y2="50" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="30" y1="75" x2="320" y2="75" stroke="#cbd5e1" stroke-width="2" />
    <line x1="30" y1="100" x2="300" y2="100" stroke="#cbd5e1" stroke-width="2" />
    <line x1="30" y1="125" x2="280" y2="125" stroke="#cbd5e1" stroke-width="2" />
  </g>

  <!-- Folha Principal: Matriz Grid A4 Plastificada -->
  <g transform="translate(100, 60)" filter="url(#dropShadow)">
    <!-- Borda externa plastificada (borda selada de polaseal de 8px) -->
    <rect width="380" height="270" rx="10" fill="url(#sheetGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7" />
    <!-- Selagem transparente de polaseal -->
    <rect x="6" y="6" width="368" height="258" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Cabeçalho da Matriz Grid -->
    <g transform="translate(24, 20)">
      <rect x="0" y="0" width="130" height="18" rx="4" fill="#047857" opacity="0.1" />
      <text x="8" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#047857">
        IFMAKER • MATRIZ GRID A4
      </text>
      <text x="160" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748b">
        [REUTILIZÁVEL - ESCREVA E APAGUE]
      </text>
    </g>

    <!-- Grade / Malha Cartesiana de Navegação Maker (5 x 4 células) -->
    <g transform="translate(24, 45)">
      <!-- Fundo da malha -->
      <rect width="332" height="195" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />

      <!-- Linhas Verticais -->
      <line x1="66.4" y1="0" x2="66.4" y2="195" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="132.8" y1="0" x2="132.8" y2="195" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="199.2" y1="0" x2="199.2" y2="195" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="265.6" y1="0" x2="265.6" y2="195" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3" />

      <!-- Linhas Horizontais -->
      <line x1="0" y1="48.75" x2="332" y2="48.75" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="0" y1="97.5" x2="332" y2="97.5" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="0" y1="146.25" x2="332" y2="146.25" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3" />

      <!-- Traçado de rota pedagógica simulada (escrita com caneta piloto azul) -->
      <path d="M 33 170 L 33 122 L 100 122 L 166 122 L 166 73 L 232 73" fill="none" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
      
      <!-- Círculo de Partida -->
      <circle cx="33" cy="170" r="12" fill="#047857" opacity="0.2" />
      <circle cx="33" cy="170" r="5" fill="#047857" />
      <text x="23" y="160" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#047857">INÍCIO</text>

      <!-- Ponto de Chegada / Alvo -->
      <circle cx="232" cy="73" r="12" fill="#dc2626" opacity="0.2" />
      <circle cx="232" cy="73" r="5" fill="#dc2626" />
      <text x="225" y="60" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#dc2626">ALVO</text>

      <!-- Obstáculo demarcado no grid -->
      <rect x="76" y="10" width="45" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
      <text x="82" y="27" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#b45309">RIO APA</text>
    </g>

    <!-- Efeito Glare / Reflexo de Luz da Laminação Plástica -->
    <path d="M 6 6 L 150 6 L 30 264 L 6 264 Z" fill="url(#glareGrad)" pointer-events="none" />
  </g>

  <!-- Caneta Marcador para Quadro Branco (Dry-Erase Marker) -->
  <g transform="translate(390, 230) rotate(-35)" filter="url(#softShadow)">
    <!-- Corpo do Marcador -->
    <rect x="0" y="0" width="165" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="25" y="3" width="95" height="20" rx="3" fill="url(#markerBody)" />
    <!-- Texto no marcador -->
    <text x="32" y="17" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" letter-spacing="1">
      MARCADOR A4
    </text>

    <!-- Tampa do Marcador (traseira) -->
    <rect x="-12" y="1" width="14" height="24" rx="3" fill="#0284c7" />

    <!-- Ponta Cônica dianteira do marcador -->
    <polygon points="165,3 185,9 185,17 165,23" fill="#334155" />
    <!-- Ponta de feltro redonda -->
    <polygon points="185,10 196,12 196,14 185,16" fill="url(#markerTip)" />
  </g>

  <!-- Flanela de Apagamento / Tecido de microfibra de canto -->
  <g transform="translate(70, 315) rotate(12)" filter="url(#softShadow)">
    <rect width="90" height="60" rx="8" fill="#38bdf8" opacity="0.85" />
    <path d="M 10 15 Q 45 5 80 18 Q 75 45 80 50 Q 40 55 10 45 Z" fill="#0284c7" opacity="0.3" />
    <text x="18" y="35" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">
      Flanela
    </text>
  </g>

  <!-- Tag / Selo Inferior de Identificação -->
  <g transform="translate(180, 395)">
    <rect x="0" y="0" width="240" height="32" rx="16" fill="#0f172a" opacity="0.9" />
    <circle cx="20" cy="16" r="6" fill="#10b981" />
    <text x="34" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">
      Pasta Sanfonada &amp; Grids A4
    </text>
  </g>
</svg>
